KERNEL_PATH=/lib/modules/${kernelver}/build
PACKAGE_NAME=ubfm-drv-dkms
PACKAGE_VERSION=1.0.0

product_side=${product_side:-host}
ubfm_acc_ldst=${ubfm_acc_ldst:-y}
ubfm_acc_cdma=${ubfm_acc_cdma:-n}
ubfm_acc_pcie_fpga=${ubfm_acc_pcie_fpga:-n}
ubfm_acc_pcie_i3c=${ubfm_acc_pcie_i3c:-n}
ubfm_debug=${ubfm_debug:-n}
enable_fpga=${enable_fpga:-off}
esl_mode=${esl_mode:-off}

MAKE[0]="make KDIR=${KERNEL_PATH} PRODUCT_SIDE=${product_side} UBFM_ACC_LDST=${ubfm_acc_ldst} UBFM_ACC_CDMA=${ubfm_acc_cdma} UBFM_ACC_PCIE_FPGA=${ubfm_acc_pcie_fpga} UBFM_ACC_PCIE_I3C=${ubfm_acc_pcie_i3c} UBFM_DEBUG=${ubfm_debug} ENABLE_FPGA=${enable_fpga} ESL_MODE=${esl_mode} modules"
CLEAN[0]="make clean KDIR=${KERNEL_PATH}"

BUILT_MODULE_NAME[0]="mami_ubfabric"
BUILT_MODULE_NAME[1]="drv_xshmem"
BUILT_MODULE_NAME[2]="mami_fmdevm"
BUILT_MODULE_NAME[3]="mami_mctrlq"
BUILT_MODULE_NAME[4]="mami_linkcom"
BUILT_MODULE_NAME[5]="drv_auth"

BUILT_MODULE_LOCATION[0]="drivers/ub/ubfm/ubfabric/"
BUILT_MODULE_LOCATION[1]="drivers/ub/ubfm/xshmem/"
BUILT_MODULE_LOCATION[2]="drivers/ub/ubfm/fmdevm/"
BUILT_MODULE_LOCATION[3]="drivers/ub/ubfm/mctrlq/"
BUILT_MODULE_LOCATION[4]="drivers/ub/ubfm/linkcom/"
BUILT_MODULE_LOCATION[5]="drivers/ub/ubfm/auth/"

DEST_MODULE_LOCATION[0]="/updates/"
DEST_MODULE_LOCATION[1]="/updates/"
DEST_MODULE_LOCATION[2]="/updates/"
DEST_MODULE_LOCATION[3]="/updates/"
DEST_MODULE_LOCATION[4]="/updates/"
DEST_MODULE_LOCATION[5]="/updates/"

AUTOINSTALL="yes"
